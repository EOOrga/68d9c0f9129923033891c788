name: Build Android Artifacts

on:
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify Dart format
        run: dart format --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build release app bundle
        run: flutter build appbundle --release

      - name: Stage release app bundle
        run: |
          version="$(sed -nE 's/^version:[[:space:]]*([^[:space:]]+).*$/\1/p' pubspec.yaml | head -n 1)"
          mkdir -p docs
          cp build/app/outputs/bundle/release/app-release.aab "docs/app-release-${version}.aab"

      - name: Build screenshot APK
        run: flutter build apk --debug --target-platform android-x64 --dart-define=SCREENSHOT_MODE=true

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-artifacts
          path: |
            docs/app-release-*.aab
            build/app/outputs/flutter-apk/app-debug.apk
